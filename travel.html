    <style>
        body{
            margin:0;
            min-height:100vh;
            background-image:url("images/background.jpeg");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;
        }

        .title{
            text-align:center;
            color:white;
            padding-top:30px;
            font-size:40px;
        }
		#box{
    display:block;
 
	 margin:40px auto;
    
    z-index:1000;

    width:700px;
    padding:30px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);

    border:2px solid white;
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);

    
    grid-template-columns:1fr 1fr;
    gap:25px 40px;
	
	max-height:420px;        /* Height of the panel */
    overflow-y:auto;
}

		.book{
    width:900px;
    margin:40px auto;
    display:flex;
    background:#fffdf7;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

	.books{
	width:600px;
     min-height:500px;
    margin:40px auto;
    padding:30px;
    background-color:white;
    border:2px solid #444;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    font-size:18px;
    
}

.page{
    width:50%;
    padding:35px;
    min-height:420px;
}

.left-page{
    background:#CEAF8C;
    border-right:3px solid #d4c39b;
}

.right-page{
     background:#D8D0B9;
}

.left-page h2,
.right-page h2{
    text-align:center;
    color:#1565c0;
}

.left-page p{
    font-size:18px;
    margin:18px 0;
}

#advice{
    text-align:justify;
    line-height:1.8;
    font-size:17px;
}

button:disabled{

    visibility:hidden;

}
.book-container{
    width:900px;
    display:flex;
    align-items:center;
}
.page-content{
    margin-top:30px;
    font-size:20px;
	color: white;
}


#box-wrapper{
    width:760px;
    margin:40px auto;
}

.navigation{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}
#item{
color:red;
}

.loading {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: white;
    padding: 40px;
}

.spinner {
    border: 6px solid #f3f3f3;
    border-top: 6px solid #007bff;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
    </style>
